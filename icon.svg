<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  
  <!-- Glowing background ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#accent)" stroke-width="16" opacity="0.25"/>
  
  <!-- Chart & Finance Graphics -->
  <path d="M 140 340 L 210 270 L 280 310 L 370 170" fill="none" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 140 340 L 210 270 L 280 310 L 370 170 L 370 340 Z" fill="url(#accent)" opacity="0.15"/>
  
  <!-- Glowing indicator dot -->
  <circle cx="370" cy="170" r="22" fill="url(#glow)"/>
</svg>