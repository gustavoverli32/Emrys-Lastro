<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  
  <!-- Glowing Background Mesh -->
  <circle cx="256" cy="256" r="160" fill="url(#primaryGrad)" opacity="0.18"/>

  <!-- Modern Finance Vector -->
  <g transform="translate(106, 106)">
    <rect x="20" y="40" width="260" height="220" rx="36" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4"/>
    <path d="M 40 200 L 100 140 L 160 170 L 250 80" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="250" cy="80" r="24" fill="url(#primaryGrad)"/>
    <circle cx="250" cy="80" r="10" fill="#ffffff"/>
  </g>
</svg>